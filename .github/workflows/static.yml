# Workflow for deploying static content to GitHub Pages (including Docusaurus)
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Build Docusaurus lab
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'lab_1_docker_localstack/package-lock.json'
      
      - name: Install dependencies
        working-directory: lab_1_docker_localstack
        run: npm ci
      
      - name: Build Docusaurus
        working-directory: lab_1_docker_localstack
        run: npm run build
      
      # Prepare combined output
      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          # Copy all static presentations
          cp -r clase_* _site/ 2>/dev/null || true
          cp -r README.md _site/ 2>/dev/null || true
          # Copy Docusaurus build
          cp -r lab_1_docker_localstack/build _site/lab_1_docker_localstack
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
