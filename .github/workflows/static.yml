# Workflow for building and deploying all content to GitHub Pages
name: Build and Deploy to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Setup Node.js for Docusaurus
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'lab_1_docker_localstack/package-lock.json'
      
      # Setup Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.26'
      
      # Build Docusaurus lab
      - name: Build Docusaurus
        working-directory: lab_1_docker_localstack
        run: |
          npm ci
          npm run build
      
      # Build all Quarto presentations
      - name: Build Quarto slides
        run: |
          quarto render clase_12_13_14_temas_faltantes_ia/index.qmd
          quarto render clase_15_16_17_arquitectura_hexagonal/index.qmd
          quarto render clase_18_19_ddd_eventos_servicios_dominio/index.qmd
          quarto render clase_22_23_docker/index.qmd
      
      # Prepare combined output (only built content)
      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          
          # Copy Quarto builds (HTML + assets)
          for dir in clase_12_13_14_temas_faltantes_ia clase_15_16_17_arquitectura_hexagonal clase_18_19_ddd_eventos_servicios_dominio clase_22_23_docker; do
            mkdir -p _site/$dir
            cp -r $dir/index.html _site/$dir/ 2>/dev/null || true
            cp -r $dir/index_files _site/$dir/ 2>/dev/null || true
            cp -r $dir/images _site/$dir/ 2>/dev/null || true
            cp -r $dir/img _site/$dir/ 2>/dev/null || true
          done
          
          # Copy Marp slides (already HTML)
          if [ -d "clase_10_11_solid_presentation" ]; then
            cp -r clase_10_11_solid_presentation _site/
          fi

          if [ -d "clase_10_11_solid_practice" ]; then
            cp -r clase_10_11_solid_practice _site/
          fi
          
          # Copy Docusaurus build
          cp -r lab_1_docker_localstack/build _site/lab_1_docker_localstack
          
          # Create root index with links
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>ENYOI Java Slides</title>
            <style>
              body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
              a { display: block; padding: 10px; margin: 5px 0; background: #f0f0f0; text-decoration: none; border-radius: 5px; }
              a:hover { background: #e0e0e0; }
            </style>
          </head>
          <body>
            <h1>ENYOI Java Slides</h1>
            <a href="clase_10_11_solid_presentation/">Clase 10-11: SOLID</a>
            <a href="clase_12_13_14_temas_faltantes_ia/">Clase 12-14: Temas Faltantes IA</a>
            <a href="clase_15_16_17_arquitectura_hexagonal/">Clase 15-17: Arquitectura Hexagonal</a>
            <a href="clase_18_19_ddd_eventos_servicios_dominio/">Clase 18-19: DDD Eventos y Servicios</a>
            <a href="clase_22_23_docker/">Clase 22-23: Docker</a>
            <a href="lab_1_docker_localstack/">Lab 1: Docker + LocalStack</a>
          </body>
          </html>
          EOF
          
          # Copy README
          cp README.md _site/ 2>/dev/null || true
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
