# Workflow for building and deploying all content to GitHub Pages
name: Build and Deploy to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Setup Node.js for Docusaurus
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'lab_1_docker_localstack/package-lock.json'
      
      # Setup Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.26'
      
      # Build Docusaurus lab
      - name: Build Docusaurus lab docker localstack
        working-directory: lab_1_docker_localstack
        run: |
          npm ci
          npm run build

      - name: Build Docusaurus arka microservicios reactivos
        working-directory: lab_2_arka_microservicios_reactivos
        run: |
          npm ci
          npm run build
      
      # Build all Quarto presentations
      - name: Build Quarto slides
        env:
          QUARTO_DIRS: >-
            clase_12_13_14_temas_faltantes_ia
            clase_15_16_17_arquitectura_hexagonal
            clase_18_19_ddd_eventos_servicios_dominio
            clase_22_23_docker
            clase_24_25_patrones_arquitectura_microservicios
            clase_26_repaso_quiz_4
            clase_27_28_spring_boot_parte_1
        run: |
          for dir in $QUARTO_DIRS; do
            quarto render $dir/index.qmd
          done

      # Prepare combined output (only built content)
      - name: Prepare deploy folder
        env:
          QUARTO_DIRS: >-
            clase_12_13_14_temas_faltantes_ia
            clase_15_16_17_arquitectura_hexagonal
            clase_18_19_ddd_eventos_servicios_dominio
            clase_22_23_docker
            clase_24_25_patrones_arquitectura_microservicios
            clase_26_repaso_quiz_4
            clase_27_28_spring_boot_parte_1
        run: |
          set -e
          mkdir -p _site

          # Copy Quarto builds — only rendered output, not source files
          for dir in $QUARTO_DIRS; do
            mkdir -p _site/$dir
            rsync -a --exclude="*.qmd" --exclude="*.scss" --exclude="*.css.map" \
              --include="index.html" \
              --include="index_files/***" \
              --include="images/***" \
              --include="img/***" \
              --include="styles.css" \
              --include="_extensions/***" \
              --exclude="*" \
              $dir/ _site/$dir/
          done

          # Copy Marp slides (already HTML, copy as-is)
          for dir in clase_10_11_solid_presentation clase_10_11_solid_practice; do
            [ -d "$dir" ] && cp -r $dir _site/
          done

          # Copy Docusaurus builds
          cp -r lab_1_docker_localstack/build _site/lab_1_docker_localstack
          cp -r lab_2_arka_microservicios_reactivos/build _site/lab_2_arka_microservicios_reactivos

          # Copy root index
          cp index.html _site/

          # Copy README if present
          cp README.md _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
